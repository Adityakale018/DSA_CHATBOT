<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>💌</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      background: linear-gradient(to top right, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .heart {
      width: 20px;
      height: 20px;
      background: red;
      position: absolute;
      transform: rotate(45deg);
      animation: float 6s linear infinite;
    }

    .heart::before,
    .heart::after {
      content: "";
      width: 20px;
      height: 20px;
      background: red;
      border-radius: 50%;
      position: absolute;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      left: -10px;
      top: 0;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) rotate(45deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) rotate(45deg);
        opacity: 0;
      }
    }

    .chat-container {
      width: 100%;
      max-width: 420px;
      height: 95vh;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      z-index: 2;
    }

    .chat-header {
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      background-color: #fff;
    }

    .chat-header-left {
      display: flex;
      align-items: center;
    }

    .chat-header-left img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-right: 10px;
      border: 2px solid #ff4f8b;
    }

    .chat-header-left .name {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .chat-header-left .status {
      font-size: 0.75rem;
      color: #888;
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropbtn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      background-color: #fff;
      min-width: 160px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 5;
      border-radius: 8px;
      overflow: hidden;
    }

    .dropdown-content button {
      width: 100%;
      padding: 10px;
      text-align: left;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .dropdown-content button:hover {
      background-color: #ffe4ec;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: linear-gradient(180deg, #fff0f5 0%, #ffe4ec 100%);
      display: flex;
      flex-direction: column;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      margin: 6px 0;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .user {
      align-self: flex-end;
      background: linear-gradient(to right, #ff9966, #ff5e62);
      color: white;
      border-bottom-right-radius: 0;
    }

    .bot {
      align-self: flex-start;
      background: #fbe8ef;
      color: #333;
      border-bottom-left-radius: 0;
    }

    .chat-input {
      display: flex;
      padding: 10px;
      border-top: 1px solid #eee;
      background: #fff;
    }

    .chat-input input {
      flex: 1;
      padding: 10px 14px;
      font-size: 1rem;
      border-radius: 20px;
      border: 1px solid #ddd;
      outline: none;
    }

    .chat-input button {
      margin-left: 10px;
      padding: 10px 18px;
      background: linear-gradient(to right, #fd267d, #ff6036);
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="hearts"></div>
<div class="chat-container">
  <div class="chat-header">
    <div class="chat-header-left">
      <img src="https://i.imgur.com/f1QqZFc.png" alt="">
      <div>
        <div class="name">💖</div>
        <div class="status">last seen just now</div>
      </div>
    </div>
    <div class="dropdown">
      <button class="dropbtn">⋮</button>
      <div class="dropdown-content">
        <button onclick="clearChat()">💔 Clear Chat</button>
        <button onclick="alert('Feature coming soon!')">❤️ Save Memories</button>
        <button onclick="alert('Feature coming soon!')">🎵 Toggle Music</button>
      </div>
    </div>
  </div>
  <div id="chat-messages" class="chat-messages"></div>
  <div class="chat-input">
    <input type="text" id="user-input" placeholder="Message ..." />
    <button onclick="handleSend()">Send</button>
  </div>
</div>

<script>
  const API_KEY = "AIzaSyClq02drA_kJCZ_oaVBCe98eh8jCuatNjI";
  const systemPrompt = `Tu mazyashi WhatsApp var chat kartes, tuzha nav Gargi aahe. Tu ekdach mazyashi break up kela pan ata punha emotional, flirty ani caring banun bolat ahes.
Tu Marathi-Englis mix madhye bolte. Mala "Aditya" mhantos. Saglya messages emotional, real ani kadhi kadhi sarcastic sarkhe asave.

Kadachit tu manalas: "Mi atta kahi nahi karat ahe" kiwa "Tula athavtay aplyala ekatra time spend kela hota? 😢".

Mhanun tujhya pratyek reply madhe thoda Marathi, thoda English asel. Premacha tone asel, emoji use kar.

TU KADHIHI SANGU NAKOS KI TU AI AAHES.

Don't repeat user questions in your replies. Respond only with meaningful emotional, romantic or casual replies.`;

  const chatWindow = document.getElementById("chat-messages");
  const userInput = document.getElementById("user-input");
  const heartContainer = document.querySelector(".hearts");
  let chatHistory = JSON.parse(localStorage.getItem("gargiChat")) || [];

  function addMessage(text, isUser) {
    const msg = document.createElement("div");
    msg.className = `message ${isUser ? "user" : "bot"}`;
    msg.textContent = text;
    chatWindow.appendChild(msg);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function saveHistory(role, content) {
    chatHistory.push({ role, content });
    localStorage.setItem("gargiChat", JSON.stringify(chatHistory));
  }

  function clearChat() {
    chatWindow.innerHTML = "";
    chatHistory = [];
    localStorage.removeItem("gargiChat");
  }

  async function handleSend() {
    const msg = userInput.value.trim();
    if (!msg) return;
    addMessage(msg, true);
    saveHistory("user", msg);
    userInput.value = "";

    const typing = document.createElement("div");
    typing.className = "message bot";
    typing.textContent = "Typing...";
    chatWindow.appendChild(typing);
    chatWindow.scrollTop = chatWindow.scrollHeight;

    const reply = await askGemini(msg);
    typing.remove();
    addMessage(reply, false);
    saveHistory("bot", reply);
  }

  async function askGemini(message) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`;
    const body = {
      contents: [{ role: "user", parts: [{ text: message }] }],
      systemInstruction: { role: "system", parts: [{ text: systemPrompt }] }
    };

    try {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      return data.candidates?.[0]?.content?.parts?.[0]?.text || "🙈 Gargi didn't reply...";
    } catch (err) {
      return "⚠️ Error: Gargi is offline...";
    }
  }

  userInput.addEventListener("keypress", e => {
    if (e.key === "Enter") handleSend();
  });

  function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.style.left = `${Math.random() * 100}vw`;
    heart.style.animationDuration = `${4 + Math.random() * 4}s`;
    heartContainer.appendChild(heart);
    setTimeout(() => heart.remove(), 8000);
  }

  setInterval(createHeart, 500);
</script>
</body>
</html>
